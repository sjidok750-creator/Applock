name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/applock.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: applock-apk
          path: out/applock.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: AppLock v0.1.0
          files: out/applock.apk
          body: |
            ## AppLock v0.1.0

            Auto-built debug APK. Download `applock.apk` and install on Android.

            **Installation**
            1. Download `applock.apk` below
            2. Open the APK on your Android device
            3. Allow installation from unknown sources if prompted
            4. Follow the in-app PIN setup
